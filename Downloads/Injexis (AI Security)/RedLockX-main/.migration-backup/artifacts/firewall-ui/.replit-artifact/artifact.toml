kind = "web"
previewPath = "/"
title = "RedLockX Firewall UI"
version = "1.0.0"
id = "artifacts/firewall-ui"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20534

[services.development]
run = "pnpm --filter @workspace/firewall-ui run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/firewall-ui", "run", "build" ]
publicDir = "artifacts/firewall-ui/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20534"
BASE_PATH = "/"
